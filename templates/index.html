<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>法学保研通知监控</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">law-school-crawler</p>
      <h1>法学保研通知监控</h1>
    </div>
    <form method="post" action="{{ url_for('crawl') }}">
      <button class="primary" type="submit">立即抓取</button>
    </form>
  </header>

  <main class="shell">
    <section class="stats" aria-label="统计">
      <div class="stat">
        <span>通知总数</span>
        <strong>{{ stats.total }}</strong>
      </div>
      <div class="stat">
        <span>已入库学校</span>
        <strong>{{ stats.schools }}</strong>
      </div>
      <div class="stat">
        <span>最近入库</span>
        <strong class="time">{{ stats.latest or "暂无数据" }}</strong>
      </div>
    </section>

    <section class="toolbar" aria-label="筛选">
      <form method="get" class="filters">
        <label>
          <span>关键词</span>
          <input name="q" value="{{ keyword }}" placeholder="夏令营 / 推免 / 学校">
        </label>
        <label>
          <span>学校</span>
          <select name="school">
            <option value="">全部学校</option>
            {% for item in schools %}
              <option value="{{ item.name }}" {% if selected_school == item.name %}selected{% endif %}>
                {{ item.name }}
              </option>
            {% endfor %}
          </select>
        </label>
        <button type="submit">查询</button>
        <a class="ghost" href="{{ url_for('index') }}">重置</a>
      </form>
    </section>

    <section class="table-wrap" aria-label="通知列表">
      <table>
        <thead>
          <tr>
            <th>学校</th>
            <th>标题</th>
            <th>日期</th>
            <th>入库时间</th>
            <th>链接</th>
          </tr>
        </thead>
        <tbody>
          {% for post in posts %}
            <tr>
              <td class="school">{{ post.school }}</td>
              <td class="title">{{ post.title }}</td>
              <td>{{ post.date or "-" }}</td>
              <td>{{ post.created_at }}</td>
              <td><a class="open" href="{{ post.url }}" target="_blank" rel="noreferrer">打开</a></td>
            </tr>
          {% else %}
            <tr>
              <td class="empty" colspan="5">暂无匹配通知</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
